name: Deploy KnowAI 1T Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wire KnowAI engine into KnowTok
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="knowai-engine.js"></script>'
          if tag in s:
              print('KnowAI engine already wired.')
              raise SystemExit(0)
          marker = '</body>'
          if marker not in s:
              raise SystemExit('index.html has no </body> marker')
          s = s.replace(marker, tag + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit deployment wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No deployment changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy KnowAI 1T virtual thread engine"
          git push
