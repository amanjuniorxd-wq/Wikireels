<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WikiReels — Knowledge, one swipe at a time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E13; --bg-elev:#12161F; --glass:rgba(255,255,255,.06); --glass-strong:rgba(255,255,255,.10);
  --border:rgba(255,255,255,.12); --gold:#D4A24C; --gold-soft:#E8C77E; --coral:#FF5470;
  --text:#F5F1E8; --text-dim:#ADB2BE; --text-mute:#6B7280; --shadow:0 20px 60px rgba(0,0,0,.45);
}
html[data-theme="light"]{
  --bg:#F6F3EC; --bg-elev:#FFFFFF; --glass:rgba(20,18,14,.05); --glass-strong:rgba(20,18,14,.09);
  --border:rgba(20,18,14,.12); --gold:#B9812E; --gold-soft:#8F651E; --coral:#E23A56;
  --text:#1A1712; --text-dim:#544E43; --text-mute:#8A8272; --shadow:0 20px 50px rgba(0,0,0,.12);
}
html[data-theme="oled"]{
  --bg:#000000; --bg-elev:#000000; --glass:rgba(255,255,255,.055); --glass-strong:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.1); --gold:#D4A24C; --gold-soft:#E8C77E; --coral:#FF5470;
  --text:#F5F1E8; --text-dim:#9CA1AD; --text-mute:#5D6270; --shadow:0 20px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0; overscroll-behavior:none;}
body{
  background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif;
  transition:background .3s ease, color .3s ease;
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

::-webkit-scrollbar{width:0;height:0;}

h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;}
.mono{font-family:'IBM Plex Mono',monospace;}

#app{position:relative; height:100dvh; width:100%; overflow:hidden;}

/* ---------- TOPBAR ---------- */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding:max(14px, env(safe-area-inset-top)) 16px 14px;
  background:linear-gradient(to bottom, rgba(0,0,0,.55), transparent);
  pointer-events:none;
}
html[data-theme="light"] .topbar{ background:linear-gradient(to bottom, rgba(246,243,236,.85), transparent); }
.topbar > *{ pointer-events:auto; }
.brand{ font-family:'Fraunces',serif; font-weight:600; font-size:20px; letter-spacing:.2px; display:flex; align-items:baseline; gap:2px; color:var(--text); text-shadow:0 1px 8px rgba(0,0,0,.4);}
.brand-mark{ color:var(--gold); font-size:26px; line-height:0;}
.topbar-actions{ display:flex; gap:8px; align-items:center; }
.icon-btn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--border);
  background:var(--glass); backdrop-filter:blur(12px); color:var(--text);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:transform .15s ease, background .15s ease;
}
.icon-btn:hover{ background:var(--glass-strong); }
.icon-btn:active{ transform:scale(.9); }
.icon-btn svg{ width:18px; height:18px; }
.streak-pill{
  display:flex; align-items:center; gap:5px; height:38px; padding:0 12px; border-radius:20px;
  border:1px solid var(--border); background:var(--glass); backdrop-filter:blur(12px); cursor:pointer;
  font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--gold-soft); font-weight:500;
}

/* ---------- MODE TABS ---------- */
.mode-tabs{
  position:fixed; top:64px; left:0; right:0; z-index:39; display:flex; gap:6px;
  padding:0 16px; pointer-events:none;
}
.mode-tabs button{
  pointer-events:auto; border:1px solid var(--border); background:var(--glass); backdrop-filter:blur(12px);
  color:var(--text-dim); font-family:'Inter'; font-size:12.5px; font-weight:600; letter-spacing:.3px;
  padding:7px 13px; border-radius:16px; cursor:pointer; transition:.15s ease; text-transform:uppercase;
}
.mode-tabs button.active{ background:var(--gold); color:#1A1508; border-color:var(--gold); }

/* ---------- CATEGORY DRAWER ---------- */
.category-drawer{
  position:fixed; top:106px; left:0; right:0; z-index:39; padding:2px 16px 10px;
  transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s ease;
}
.category-drawer.hidden{ transform:translateY(-140%); opacity:0; pointer-events:none; }
.chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
.chip{
  flex:0 0 auto; border:1px solid var(--border); background:var(--glass); backdrop-filter:blur(12px);
  color:var(--text-dim); font-size:12.5px; font-weight:500; padding:7px 13px; border-radius:14px;
  cursor:pointer; white-space:nowrap; transition:.15s ease;
}
.chip.active{ background:var(--coral); color:#fff; border-color:var(--coral); }

/* ---------- FEED ---------- */
.feed{
  height:100dvh; width:100%; overflow-y:scroll; scroll-snap-type:y mandatory;
  scroll-behavior:smooth;
}
.card{
  position:relative; height:100dvh; width:100%; scroll-snap-align:start; scroll-snap-stop:always;
  display:flex; flex-direction:column; justify-content:flex-end; overflow:hidden;
  background:var(--bg-elev);
}
.card-media{ position:absolute; inset:0; overflow:hidden; background:var(--bg-elev); }
.media-blur{
  position:absolute; inset:-6%; width:112%; height:112%; object-fit:cover; object-position:center;
  filter:blur(24px) saturate(1.1) brightness(.85); transform:scale(1.06); opacity:1; transition:opacity .5s ease .1s;
}
.media-full{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center;
  filter:saturate(1.05); opacity:0; transition:opacity .55s ease;
}
.media-full.loaded{ opacity:1; }
.media-gradient{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.media-gradient .g-letter{
  font-family:'Fraunces',serif; font-weight:600; font-size:min(46vw,260px); line-height:1;
  color:rgba(255,255,255,.14); user-select:none; transform:translateY(-4%);
}
html[data-theme="light"] .media-gradient .g-letter{ color:rgba(0,0,0,.10); }
.card-scrim{
  position:absolute; inset:0;
  background:linear-gradient(to bottom, rgba(6,7,10,.15) 0%, rgba(6,7,10,.05) 30%, rgba(6,7,10,.55) 62%, rgba(6,7,10,.92) 100%);
}
html[data-theme="light"] .card-scrim{
  background:linear-gradient(to bottom, rgba(20,18,14,.05) 0%, rgba(20,18,14,.02) 28%, rgba(20,18,14,.55) 62%, rgba(20,18,14,.93) 100%);
}
.card-top{
  position:absolute; top:112px; left:18px; right:90px; z-index:2; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
}
.tag{
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  padding:5px 10px; border-radius:20px; background:rgba(212,162,76,.16); color:var(--gold-soft);
  border:1px solid rgba(212,162,76,.35);
}
.read-time{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:#fff; opacity:.75; }
.card-body{ position:relative; z-index:2; padding:0 90px 26px 18px; max-width:640px;}
.card-title{ font-size:28px; line-height:1.12; font-weight:600; margin:0 0 8px; color:#fff; text-wrap:balance;}
.card-desc{ font-size:13.5px; color:var(--gold-soft); margin:0 0 10px; font-weight:500; }
.card-extract{ font-size:15px; line-height:1.55; color:rgba(255,255,255,.92); margin:0 0 14px; max-height:26vh; overflow:hidden;}
.card-extract strong{ color:var(--gold-soft); font-weight:600; }
.card-link{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:#fff; opacity:.7; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.3); padding-bottom:2px;}
.card-catalog{
  position:absolute; bottom:26px; left:18px; z-index:2; font-family:'IBM Plex Mono',monospace; font-size:10px;
  color:rgba(255,255,255,.4); letter-spacing:.08em; display:none;
}

/* action rail */
.card-rail{
  position:absolute; right:12px; bottom:34px; z-index:3; display:flex; flex-direction:column; gap:16px; align-items:center;
}
.rail-btn{
  background:none; border:none; color:#fff; display:flex; flex-direction:column; align-items:center; gap:4px;
  cursor:pointer; font-family:'Inter'; font-size:10.5px; font-weight:600; opacity:.95;
}
.rail-btn .ico{
  width:46px; height:46px; border-radius:50%; background:var(--glass); backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; transition:transform .15s ease, background .2s ease;
}
.rail-btn svg{ width:20px; height:20px; stroke:#fff; }
.rail-btn:active .ico{ transform:scale(.86); }
.rail-btn.on .ico{ background:var(--coral); border-color:var(--coral); }
.rail-btn.on svg{ fill:#fff; stroke:#fff; }
.rail-btn.star-on .ico{ background:var(--gold); border-color:var(--gold); }
.rail-btn.star-on svg{ fill:#1A1508; stroke:#1A1508; }
.rail-btn .ico.brit-badge{ font-family:'Fraunces',serif; font-weight:700; font-size:19px; color:#fff; background:#A8232F; border-color:#A8232F;}

/* skeleton */
.skeleton{ position:relative; height:100dvh; width:100%; scroll-snap-align:start; background:var(--bg-elev); overflow:hidden;}
.skeleton .shimmer{ position:absolute; inset:0; background:linear-gradient(100deg, var(--bg-elev) 30%, var(--glass-strong) 50%, var(--bg-elev) 70%); background-size:200% 100%; animation:shimmer 1.4s infinite;}
@keyframes shimmer{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
.skeleton .sk-block{ position:absolute; left:18px; right:90px; background:var(--glass-strong); border-radius:8px;}
.error-card{ position:relative; height:100dvh; width:100%; scroll-snap-align:start; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:40px;}
.error-card button{ background:var(--gold); border:none; color:#1A1508; font-weight:700; padding:10px 20px; border-radius:20px; cursor:pointer;}

/* ---------- OVERLAYS ---------- */
.overlay{
  position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; flex-direction:column;
  transform:translateY(0); transition:transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s ease;
}
.overlay.hidden{ transform:translateY(100%); opacity:0; pointer-events:none; }

/* search */
.search-box{ display:flex; align-items:center; gap:10px; padding:max(16px, env(safe-area-inset-top)) 16px 12px; border-bottom:1px solid var(--border);}
.search-box input{
  flex:1; background:var(--glass); border:1px solid var(--border); border-radius:14px; padding:12px 14px;
  color:var(--text); font-size:16px; font-family:'Inter'; outline:none;
}
.search-box input:focus{ border-color:var(--gold); }
.suggestions{ list-style:none; margin:0; padding:8px 10px; overflow-y:auto; flex:1;}
.suggestions li{ padding:14px 10px; border-bottom:1px solid var(--border); cursor:pointer; display:flex; flex-direction:column; gap:3px;}
.suggestions li:hover{ background:var(--glass); }
.suggestions .s-title{ font-family:'Fraunces',serif; font-size:17px; font-weight:600;}
.suggestions .s-desc{ font-size:12.5px; color:var(--text-mute);}
.suggestions .empty{ text-align:center; color:var(--text-mute); padding:60px 20px; font-size:14px;}

/* reader */
.reader-header{ display:flex; align-items:center; justify-content:space-between; padding:max(14px, env(safe-area-inset-top)) 16px 12px; border-bottom:1px solid var(--border);}
.reader-controls{ display:flex; gap:8px; }
.reader-controls button{
  height:34px; min-width:34px; padding:0 10px; border-radius:10px; border:1px solid var(--border); background:var(--glass);
  color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:13px; cursor:pointer;
}
.reader-progress{ height:2px; background:var(--glass); }
.reader-progress-bar{ height:100%; width:0%; background:var(--gold); transition:width .1s linear;}
.reader-body{ overflow-y:auto; padding:22px 20px 80px; flex:1;}
.reader-body img{ width:100%; border-radius:14px; margin-bottom:18px;}
.reader-body h1{ font-size:28px; margin:0 0 4px; }
.reader-body .r-desc{ color:var(--gold-soft); font-size:14px; margin-bottom:18px; font-weight:500;}
.reader-body p{ line-height:1.75; margin:0 0 16px; color:var(--text); }
.reader-body .r-head{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-mute); margin:26px 0 10px; }
.reader-body .r-ext{ display:inline-block; margin-top:10px; margin-right:10px; padding:11px 18px; background:var(--gold); color:#1A1508; border-radius:20px; text-decoration:none; font-weight:700; font-size:13.5px;}
.reader-body .r-ext-alt{ display:inline-block; margin-top:10px; padding:10px 17px; background:none; border:1.5px solid #A8232F; color:#A8232F; border-radius:20px; text-decoration:none; font-weight:700; font-size:13.5px;}
.reader-loading{ padding:60px 20px; text-align:center; color:var(--text-mute); }

/* profile */
.profile-body{ overflow-y:auto; padding:max(20px, env(safe-area-inset-top)) 20px 40px; flex:1;}
.profile-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;}
.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px;}
.stat-card{ background:var(--glass); border:1px solid var(--border); border-radius:16px; padding:16px;}
.stat-num{ font-family:'Fraunces',serif; font-size:28px; font-weight:600; color:var(--gold);}
.stat-label{ font-size:11.5px; color:var(--text-mute); text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}
.section-title{ font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin:22px 0 10px;}
.badge-row{ display:flex; gap:8px; flex-wrap:wrap;}
.badge{ font-size:11.5px; padding:7px 12px; border-radius:14px; background:var(--glass); border:1px solid var(--border); color:var(--text-dim);}
.badge.earned{ background:rgba(212,162,76,.15); border-color:var(--gold); color:var(--gold-soft);}
.list-row{ display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); cursor:pointer;}
.list-row img{ width:52px; height:52px; border-radius:10px; object-fit:cover; background:var(--glass); flex:0 0 auto;}
.list-row .lt{ font-weight:600; font-size:14px;}
.list-row .ld{ font-size:12px; color:var(--text-mute);}
.empty-note{ color:var(--text-mute); font-size:13px; padding:14px 0;}
.tab-row{ display:flex; gap:8px; margin-bottom:6px;}
.tab-row button{ flex:1; padding:9px; border-radius:12px; border:1px solid var(--border); background:var(--glass); color:var(--text-dim); font-weight:600; font-size:12.5px; cursor:pointer;}
.tab-row button.active{ background:var(--text); color:var(--bg); }

/* toast */
.toast-host{ position:fixed; bottom:calc(env(safe-area-inset-bottom) + 22px); left:0; right:0; z-index:100; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;}
.toast{
  background:var(--text); color:var(--bg); padding:10px 18px; border-radius:20px; font-size:13px; font-weight:600;
  box-shadow:var(--shadow); animation:toastIn .25s ease, toastOut .25s ease 1.8s forwards;
}
@keyframes toastIn{ from{ opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes toastOut{ to{ opacity:0; transform:translateY(-8px);} }

/* focus visibility */
button:focus-visible, input:focus-visible, a:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

@media(min-width:720px){
  .feed{ max-width:460px; margin:0 auto; border-left:1px solid var(--border); border-right:1px solid var(--border); }
  body{ background:var(--bg); }
  #app::before{ content:""; position:fixed; inset:0; background:radial-gradient(circle at 50% 50%, var(--bg-elev), var(--bg)); z-index:-1;}
}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">WikiReels<span class="brand-mark">·</span></div>
    <div class="topbar-actions">
      <button class="streak-pill" id="btnProfile" aria-label="Your stats">🔥 <span id="streakNum">0</span></button>
      <button class="icon-btn" id="btnCategories" aria-label="Categories">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
      <button class="icon-btn" id="btnSearch" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <button class="icon-btn" id="btnTheme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
      </button>
    </div>
  </header>

  <nav class="mode-tabs" id="modeTabs">
    <button data-mode="foryou" class="active">For You</button>
    <button data-mode="trending">Trending</button>
    <button data-mode="featured">Featured</button>
  </nav>

  <div class="category-drawer hidden" id="categoryDrawer">
    <div class="chip-row" id="chipRow"></div>
  </div>

  <main class="feed" id="feed" aria-live="polite"></main>

  <!-- SEARCH OVERLAY -->
  <div class="overlay hidden" id="searchOverlay">
    <div class="search-box">
      <input id="searchInput" placeholder="Search Wikipedia…" autocomplete="off" />
      <button class="icon-btn" id="closeSearch" aria-label="Close search">✕</button>
    </div>
    <ul class="suggestions" id="searchSuggestions"></ul>
  </div>

  <!-- READER OVERLAY -->
  <div class="overlay hidden" id="readerOverlay">
    <div class="reader-header">
      <button class="icon-btn" id="closeReader" aria-label="Close reader">✕</button>
      <div class="reader-controls">
        <button id="fontDown">A−</button>
        <button id="fontUp">A+</button>
        <button id="listenBtn">🔊</button>
      </div>
    </div>
    <div class="reader-progress"><div class="reader-progress-bar" id="readerProgressBar"></div></div>
    <div class="reader-body" id="readerBody"></div>
  </div>

  <!-- PROFILE OVERLAY -->
  <div class="overlay hidden" id="profileOverlay">
    <div class="profile-body">
      <div class="profile-header">
        <h2 class="serif" style="margin:0;font-size:22px;">Your Reading</h2>
        <button class="icon-btn" id="closeProfile" aria-label="Close">✕</button>
      </div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-num" id="statXP">0</div><div class="stat-label">XP · Level <span id="statLevel">1</span></div></div>
        <div class="stat-card"><div class="stat-num" id="statStreak">0</div><div class="stat-label">Day streak</div></div>
        <div class="stat-card"><div class="stat-num" id="statCompleted">0</div><div class="stat-label">Articles read</div></div>
        <div class="stat-card"><div class="stat-num" id="statSaved">0</div><div class="stat-label">Saved</div></div>
      </div>
      <div class="section-title">Badges</div>
      <div class="badge-row" id="badgeRow"></div>
      <div class="section-title">Daily challenge</div>
      <div class="stat-card" id="challengeCard" style="cursor:pointer;"></div>
      <div class="tab-row" style="margin-top:26px;">
        <button data-tab="saved" class="active">Saved</button>
        <button data-tab="favorites">Favorites</button>
        <button data-tab="history">History</button>
      </div>
      <div id="listPanel"></div>
    </div>
  </div>

  <div class="toast-host" id="toastHost"></div>
</div>

<script>
(function(){
"use strict";

/* ===================== ICONS ===================== */
const ICONS = {
  heart:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 21s-7.5-4.6-10-9.3C.5 8 2 4 6 4c2.3 0 3.8 1.3 6 4 2.2-2.7 3.7-4 6-4 4 0 5.5 4 4 7.7-2.5 4.7-10 9.3-10 9.3z"/></svg>`,
  star:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 2l2.9 6.6L22 9.6l-5 4.8L18.4 22 12 18.3 5.6 22 7 14.4l-5-4.8 7.1-1z"/></svg>`,
  share:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M7 17L17 7M9 7h8v8"/></svg>`,
  book:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 5c2-1 5-1 7 0v14c-2-1-5-1-7 0V5zM20 5c-2-1-5-1-7 0v14c2-1 5-1 7 0V5z"/></svg>`,
  dice:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/><circle cx="16" cy="8" r="1.2" fill="currentColor"/><circle cx="8" cy="16" r="1.2" fill="currentColor"/><circle cx="16" cy="16" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>`,
  volume:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 8a5 5 0 010 8"/></svg>`
};

/* ===================== STORAGE ===================== */
// Persistence is a nice-to-have. If the storage bridge is unavailable or errors,
// we fall back to in-memory state for the session instead of surfacing repeated warnings.
let storageOK = (typeof window !== 'undefined' && !!window.storage);
let storageWarned = false;

async function sGet(key, def){
  if(!storageOK) return def;
  try{
    const r = await window.storage.get(key, false);
    return r && r.value ? JSON.parse(r.value) : def;
  }catch(e){
    // Key not found throws per storage API spec — that's expected on first run, not a failure.
    return def;
  }
}
async function sSet(key, val){
  if(!storageOK) return;
  try{
    await window.storage.set(key, JSON.stringify(val), false);
  }catch(e){
    storageOK = false;
    if(!storageWarned){
      storageWarned = true;
      showToast("Progress won't be saved this session");
    }
  }
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

const feedEl = document.getElementById('feed');
const chipRow = document.getElementById('chipRow');

/* ===================== INIT ===================== */
async function init(){
  state.saved = await sGet('wikireels:saved', []);
  state.favorites = await sGet('wikireels:favorites', []);
  state.history = await sGet('wikireels:history', []);
  state.stats = await sGet('wikireels:stats', {xp:0, streak:0, completed:0, lastActive:null});
  bumpStreak();
  renderChips();
  updateStreakPill();
  await loadMore(3);
  observeCards();
}

function bumpStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(state.stats.lastActive === today) return;
  if(state.stats.lastActive){
    const diff = (new Date(today) - new Date(state.stats.lastActive)) / 86400000;
    state.stats.streak = diff === 1 ? state.stats.streak + 1 : 1;
  } else {
    state.stats.streak = 1;
  }
  state.stats.lastActive = today;
  sSet('wikireels:stats', state.stats);
}

/* ===================== WIKIPEDIA API ===================== */
const REST = 'https://en.wikipedia.org/api/rest_v1';
const ACTION = 'https://en.wikipedia.org/w/api.php';

function normalize(data, categoryLabel){
  if(!data || data.type === 'disambiguation') return null;
  const extract = data.extract || '';
  if(extract.length < 40) return null;
  return {
    pageid: data.pageid,
    title: data.title,
    description: data.description || '',
    extract,
    thumbnail: (data.thumbnail && data.thumbnail.source) || null,
    originalimage: (data.originalimage && data.originalimage.source) || null,
    originalWidth: (data.originalimage && data.originalimage.width) || 0,
    originalHeight: (data.originalimage && data.originalimage.height) || 0,
    url: (data.content_urls && data.content_urls.desktop && data.content_urls.desktop.page) || `https://en.wikipedia.org/wiki/${encodeURIComponent(data.title)}`,
    category: categoryLabel || (data.description ? data.description.split(',')[0] : 'Wikipedia')
  };
}

async function fetchRandom(categoryLabel){
  for(let i=0;i<4;i++){
    try{
      const r = await fetch(`${REST}/page/random/summary`);
      const d = await r.json();
      const n = normalize(d, categoryLabel);
      if(n && !state.seenIds.has(n.pageid)) return n;
    }catch(e){}
  }
  return null;
}

/* ----- category tree traversal: pulls articles Wikipedia has actually classified
   under a topic, rather than text-matching the topic's name ----- */
const TITLE_SKIP = /^(List of|Index of|Outline of|Glossary of|Timeline of|Bibliography of)/i;

async function fetchCategoryMembers(categoryName, limit, namespace){
  try{
    const url = `${ACTION}?action=query&list=categorymembers&cmtitle=${encodeURIComponent('Category:'+categoryName)}&cmlimit=${limit}&cmnamespace=${namespace}&format=json&origin=*`;
    const r = await fetch(url);
    const d = await r.json();
    return (d.query && d.query.categorymembers || []).map(m=>m.title);
  }catch(e){ return []; }
}

async function buildCategoryPool(catName){
  let pages = await fetchCategoryMembers(catName, 40, 0); // ns 0 = articles
  pages = pages.filter(t=>!TITLE_SKIP.test(t));
  if(pages.length < 25){
    const subcats = await fetchCategoryMembers(catName, 10, 14); // ns 14 = subcategories
    const picks = shuffleArray(subcats).slice(0,4).map(t=>t.replace(/^Category:/,''));
    for(const sc of picks){
      const subPages = await fetchCategoryMembers(sc, 15, 0);
      pages.push(...subPages.filter(t=>!TITLE_SKIP.test(t)));
    }
  }
  return [...new Set(pages)];
}

async function fetchTitlesBySearch(term){
  try{
    const url = `${ACTION}?action=query&list=search&srsearch=${encodeURIComponent(term)}&format=json&origin=*&srlimit=20`;
    const r = await fetch(url);
    const d = await r.json();
    return (d.query && d.query.search || []).map(s=>s.title);
  }catch(e){ return []; }
}

async function fetchSummaryByTitle(title, categoryLabel){
  try{
    const r = await fetch(`${REST}/page/summary/${encodeURIComponent(title.replace(/ /g,'_'))}`);
    if(!r.ok) return null;
    const d = await r.json();
    return normalize(d, categoryLabel);
  }catch(e){ return null; }
}

let categoryQueue = [];
async function fetchCategoryArticle(catObj){
  if(!catObj.primary) return fetchRandom('Random');
  if(categoryQueue.length === 0){
    let pool = await buildCategoryPool(catObj.primary);
    if(pool.length < 8 && catObj.alt) pool.push(...await buildCategoryPool(catObj.alt));
    if(pool.length < 5) pool.push(...await fetchTitlesBySearch(catObj.fallback || catObj.label));
    categoryQueue = shuffleArray([...new Set(pool)]);
  }
  while(categoryQueue.length){
    const title = categoryQueue.shift();
    const n = await fetchSummaryByTitle(title, catObj.label);
    if(n && !state.seenIds.has(n.pageid)) return n;
  }
  return fetchRandom(catObj.label);
}

let searchQueue = [];
async function fetchSearchArticle(){
  while(searchQueue.length){
    const title = searchQueue.shift();
    const n = await fetchSummaryByTitle(title, 'Search');
    if(n && !state.seenIds.has(n.pageid)) return n;
  }
  return null;
}

let trendingQueue = null;
async function fetchTrendingArticle(){
  if(trendingQueue === null){
    trendingQueue = [];
    for(const daysAgo of [0,1,2]){
      try{
        const d = new Date(Date.now() - daysAgo*86400000);
        const y=d.getUTCFullYear(), m=String(d.getUTCMonth()+1).padStart(2,'0'), day=String(d.getUTCDate()).padStart(2,'0');
        const r = await fetch(`${REST}/feed/featured/${y}/${m}/${day}`);
        const data = await r.json();
        const arts = (data.mostread && data.mostread.articles) || [];
        trendingQueue.push(...arts);
        if(trendingQueue.length) break;
      }catch(e){}
    }
  }
  while(trendingQueue.length){
    const a = trendingQueue.shift();
    const n = normalize(a, 'Trending');
    if(n && !state.seenIds.has(n.pageid)) return n;
  }
  return fetchRandom('Trending');
}

async function fetchFeaturedArticle(){
  for(const daysAgo of [0,1,2,3]){
    try{
      const d = new Date(Date.now() - daysAgo*86400000);
      const y=d.getUTCFullYear(), m=String(d.getUTCMonth()+1).padStart(2,'0'), day=String(d.getUTCDate()).padStart(2,'0');
      const r = await fetch(`${REST}/feed/featured/${y}/${m}/${day}`);
      const data = await r.json();
      if(data.tfa){
        const n = normalize(data.tfa, "Today's Featured");
        if(n && !state.seenIds.has(n.pageid)) return n;
      }
    }catch(e){}
  }
  return fetchRandom('Featured');
}

async function fetchNextArticle(){
  if(state.mode === 'category') return fetchCategoryArticle(state.category);
  if(state.mode === 'trending') return fetchTrendingArticle();
  if(state.mode === 'featured') return fetchFeaturedArticle();
  if(state.mode === 'search') return fetchSearchArticle();
  return fetchRandom('For You');
}

/* ===================== READING HELPERS ===================== */
function estimateReadTime(text){ return Math.max(1, Math.round(text.split(/\s+/).length / 200)); }
function previewThumb(article){ return article.resolvedImage || article.thumbnail || article.originalimage || null; }

function highlight(text){
  const esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const words = esc.split(/(\s+)/);
  let count = 0;
  return words.map((w,i)=>{
    const clean = w.replace(/[.,;:()"]/g,'');
    if(count < 6 && i>0 && /^[A-Z][a-zA-Z]{3,}$/.test(clean) && clean.toLowerCase() !== clean){
      count++;
      return `<strong>${w}</strong>`;
    }
    return w;
  }).join('');
}

/* ===================== IMAGE PIPELINE ===================== */
// Resolves the highest-quality, most representative image for an article:
// 1. instant blurred placeholder from the summary thumbnail (already fetched, fast)
// 2. background lookup of every image on the page, scored for resolution / orientation / subject relevance
// 3. Commons search fallback if the article itself has no usable photo
// 4. deterministic premium gradient as a last resort
const imageCache = new Map(); // pageid -> resolved {full, blur}
const BAD_IMAGE_PATTERN = /icon|logo|flag_of|seal_of|coat_of_arms|signature|symbol|_map|worldmap|locator|_chart|diagram|_graph|question_mark|commons-logo|wiki(pedia|media|quote|source)?[-_]?logo|edit-icon|ambox|padlock|folder|button|stub_|sound[-_]?icon|speaker|audio|loudspeaker|nowrap|crystal_|gnome-|emblem|monogram|coa_|blank\.|pictogram/i;
const GOOD_EXT = /\.(jpe?g|png)$/i;
const TARGET_W = Math.min(1600, Math.round((typeof window!=='undefined'?window.innerWidth:400) * (window.devicePixelRatio||1) * 1.4));

function gradientPalette(seed){
  const palettes = [
    ['#2A1B12','#0B0E13'], ['#12263A','#0B0E13'], ['#3A1220','#0B0E13'],
    ['#1F2937','#0B0E13'], ['#2E2410','#0B0E13'], ['#1A2E24','#0B0E13'],
    ['#301A3A','#0B0E13'], ['#0F2A2A','#0B0E13']
  ];
  let h = 0; for(let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  return palettes[h % palettes.length];
}

function mountMedia(mediaEl, article){
  const [c1,c2] = gradientPalette(article.title || String(article.pageid));
  const initial = (article.title||'?').trim().charAt(0).toUpperCase();
  const blurSrc = article.thumbnail || article.originalimage;

  mediaEl.style.background = `linear-gradient(160deg, ${c1}, ${c2})`;

  if(blurSrc){
    const blurImg = document.createElement('img');
    blurImg.className = 'media-blur';
    blurImg.alt = '';
    blurImg.loading = 'lazy';
    blurImg.src = blurSrc;
    mediaEl.appendChild(blurImg);
  } else {
    const g = document.createElement('div');
    g.className = 'media-gradient';
    g.innerHTML = `<span class="g-letter serif">${escapeHtml(initial)}</span>`;
    mediaEl.appendChild(g);
  }

  resolveBestImage(article).then(result=>{
    if(!result || !mediaEl.isConnected) { if(result) article.resolvedFull = result.full; return; }
    article.resolvedImage = result.display;
    article.resolvedFull = result.full;
    const img = document.createElement('img');
    img.className = 'media-full';
    img.alt = '';
    img.decoding = 'async';
    img.onload = ()=> img.classList.add('loaded');
    img.onerror = ()=>{ img.remove(); };
    img.src = result.display;
    mediaEl.appendChild(img);
  });
}

async function resolveBestImage(article){
  if(imageCache.has(article.pageid)) return imageCache.get(article.pageid);
  let result = null;
  try{
    const candidates = await gatherImageCandidates(article.title);
    let best = pickBest(candidates);
    if(!best && article.originalimage){
      best = {url:article.originalimage, thumburl:article.originalimage, width:article.originalWidth||1200, height:article.originalHeight||800};
    }
    if(!best){
      const commons = await commonsSearch(article.title);
      best = pickBest(commons);
    }
    if(best){
      const display = (best.width && best.width <= TARGET_W * 1.3) ? best.url : (best.thumburl || best.url);
      const ok = await tryLoad(display);
      result = ok ? {display, full: best.url} : (article.originalimage ? {display:article.originalimage, full:article.originalimage} : null);
    } else if(article.originalimage){
      result = {display: article.originalimage, full: article.originalimage};
    }
  }catch(e){ /* fall through to gradient */ }
  imageCache.set(article.pageid, result);
  return result;
}

function tryLoad(url){
  return new Promise(resolve=>{
    const img = new Image();
    const timer = setTimeout(()=>resolve(false), 9000);
    img.onload = ()=>{ clearTimeout(timer); resolve(true); };
    img.onerror = ()=>{ clearTimeout(timer); resolve(false); };
    img.src = url;
  });
}

async function gatherImageCandidates(title){
  try{
    const listUrl = `${ACTION}?action=query&titles=${encodeURIComponent(title)}&prop=images&imlimit=25&format=json&origin=*`;
    const r = await fetch(listUrl);
    const d = await r.json();
    const pages = d.query && d.query.pages;
    if(!pages) return [];
    const page = pages[Object.keys(pages)[0]];
    let files = (page.images || []).map(i=>i.title).filter(t=>!BAD_IMAGE_PATTERN.test(t));
    let preferred = files.filter(t=>GOOD_EXT.test(t));
    if(!preferred.length) preferred = files;
    preferred = preferred.slice(0, 10);
    if(!preferred.length) return [];
    return await fetchImageInfo(preferred);
  }catch(e){ return []; }
}

async function fetchImageInfo(fileTitles){
  try{
    const url = `${ACTION}?action=query&titles=${encodeURIComponent(fileTitles.join('|'))}&prop=imageinfo&iiprop=url|size|mime&iiurlwidth=${TARGET_W}&format=json&origin=*`;
    const r = await fetch(url);
    const d = await r.json();
    const pages = d.query && d.query.pages;
    if(!pages) return [];
    return Object.values(pages).map(p=>{
      const info = p.imageinfo && p.imageinfo[0];
      if(!info) return null;
      return {title:p.title, url:info.url, thumburl:info.thumburl, width:info.width, height:info.height, mime:info.mime};
    }).filter(Boolean);
  }catch(e){ return []; }
}

async function commonsSearch(title){
  try{
    const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(title)}&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url|size|mime&iiurlwidth=${TARGET_W}&format=json&origin=*`;
    const r = await fetch(url);
    const d = await r.json();
    const pages = d.query && d.query.pages;
    if(!pages) return [];
    return Object.values(pages).map(p=>{
      const info = p.imageinfo && p.imageinfo[0];
      if(!info) return null;
      return {title:p.title, url:info.url, thumburl:info.thumburl, width:info.width, height:info.height, mime:info.mime};
    }).filter(Boolean).filter(c=>!BAD_IMAGE_PATTERN.test(c.title));
  }catch(e){ return []; }
}

function scoreImage(c){
  if(!c.width || !c.height) return -1;
  if(c.mime === 'image/svg+xml' || c.mime === 'image/gif') return -1; // tier-2 only, handled by not being in tier-1 pool
  let score = Math.min(c.width,4000) * Math.min(c.height,4000);
  if(c.width > c.height * 1.05) score *= 1.25;      // landscape bonus
  else if(Math.abs(c.width - c.height) < c.width*0.05) score *= 0.85; // near-square, likely icon/logo
  if(c.width < 400) score *= 0.3;                    // heavily penalize low-res
  return score;
}

function pickBest(candidates){
  if(!candidates || !candidates.length) return null;
  const tier1 = candidates.filter(c=>scoreImage(c) > 0);
  const pool = tier1.length ? tier1 : candidates.filter(c=>c.width && c.height);
  if(!pool.length) return null;
  pool.sort((a,b)=> (scoreImage(b)||0) - (scoreImage(a)||0));
  return pool[0];
}

function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadMore(n){
  if(state.loading) return;
  state.loading = true;
  const skeletons = [];
  for(let i=0;i<n;i++){ const sk = skeletonCard(); feedEl.appendChild(sk); skeletons.push(sk); }
  for(let i=0;i<n;i++){
    const article = await fetchNextArticle();
    const sk = skeletons[i];
    if(article){
      state.seenIds.add(article.pageid);
      state.articles.push(article);
      const el = cardEl(article, state.articles.length-1);
      sk.replaceWith(el);
      observeCard(el);
    } else {
      sk.outerHTML = `<div class="error-card"><div class="serif" style="font-size:20px;">Couldn't load an article</div><div style="color:var(--text-mute);font-size:13px;max-width:260px;">Wikipedia's API may be unreachable right now.</div><button onclick="location.reload()">Reload</button></div>`;
    }
  }
  state.loading = false;
}

/* ===================== INTERSECTION / ACTIVE CARD ===================== */
let observer;
function observeCards(){
  observer = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting && e.intersectionRatio > 0.6){
        onCardActive(e.target);
      }
    });
  }, {root: feedEl, threshold:[0.6]});
}
function observeCard(el){ observer && observer.observe(el); }

function onCardActive(el){
  const idx = parseInt(el.dataset.idx,10);
  const pageid = parseInt(el.dataset.pageid,10);
  const article = state.articles[idx];
  if(!article) return;

  if(state.articles.length - idx <= 2 && !state.loading) loadMore(3);

  pushHistory(article);

  if(!state.completedThisSession.has(pageid)){
    clearTimeout(state.activeTimers[pageid]);
    state.activeTimers[pageid] = setTimeout(()=>{
      state.completedThisSession.add(pageid);
      state.stats.xp += 10;
      state.stats.completed += 1;
      sSet('wikireels:stats', state.stats);
      updateStreakPill();
      renderProfileStats();
    }, 4000);
  }
}

async function pushHistory(article){
  if(state.history[0] && state.history[0].pageid === article.pageid) return;
  state.history = state.history.filter(a=>a.pageid !== article.pageid);
  state.history.unshift({pageid:article.pageid, title:article.title, thumbnail:previewThumb(article), description:article.description, url:article.url, viewedAt:Date.now()});
  state.history = state.history.slice(0,60);
  await sSet('wikireels:history', state.history);
}

/* ===================== ACTIONS (event delegation) ===================== */
feedEl.addEventListener('click', async (e)=>{
  const btn = e.target.closest('.rail-btn');
  if(!btn) return;
  const card = btn.closest('.card');
  const idx = parseInt(card.dataset.idx,10);
  const article = state.articles[idx];
  const action = btn.dataset.action;

  if(action === 'save') await toggleSave(article, btn);
  if(action === 'favorite') await toggleFavorite(article, btn);
  if(action === 'share') await shareArticle(article);
  if(action === 'read') openReader(article);
  if(action === 'britannica') openBritannica(article);
  if(action === 'listen') toggleListen(article);
  if(action === 'random') await jumpRandom(idx);
});

async function toggleSave(article, btn){
  const exists = state.saved.some(a=>a.pageid===article.pageid);
  if(exists){ state.saved = state.saved.filter(a=>a.pageid!==article.pageid); btn.classList.remove('on'); showToast('Removed from saved'); }
  else{ state.saved.unshift(minimalArticle(article)); btn.classList.add('on'); showToast('Saved for later'); }
  await sSet('wikireels:saved', state.saved);
  renderProfileStats();
}
async function toggleFavorite(article, btn){
  const exists = state.favorites.some(a=>a.pageid===article.pageid);
  if(exists){ state.favorites = state.favorites.filter(a=>a.pageid!==article.pageid); btn.classList.remove('star-on'); showToast('Removed from favorites'); }
  else{ state.favorites.unshift(minimalArticle(article)); btn.classList.add('star-on'); showToast('Added to favorites'); state.stats.xp += 5; sSet('wikireels:stats', state.stats); updateStreakPill(); }
  await sSet('wikireels:favorites', state.favorites);
  renderProfileStats();
}
function minimalArticle(a){ return {pageid:a.pageid,title:a.title,description:a.description,thumbnail:previewThumb(a),url:a.url,category:a.category,extract:a.extract}; }

function britannicaUrl(article){
  return `https://www.britannica.com/search?query=${encodeURIComponent(article.title)}`;
}
function openBritannica(article){
  window.open(britannicaUrl(article), '_blank', 'noopener');
}

async function shareArticle(article){
  const shareData = {title: article.title, text: article.description || 'Check this out on WikiReels', url: article.url};
  if(navigator.share){
    try{ await navigator.share(shareData); }catch(e){}
  } else {
    try{ await navigator.clipboard.writeText(article.url); showToast('Link copied'); }catch(e){ showToast(article.url); }
  }
}

async function jumpRandom(afterIdx){
  const article = await fetchRandom('For You');
  if(!article) return;
  state.seenIds.add(article.pageid);
  state.articles.splice(afterIdx+1, 0, article);
  const el = cardEl(article, afterIdx+1);
  const refEl = feedEl.children[afterIdx+1];
  feedEl.insertBefore(el, refEl || null);
  reindexCards();
  observeCard(el);
  el.scrollIntoView({behavior:'smooth'});
}
function reindexCards(){
  [...feedEl.children].forEach((c,i)=>{ if(c.classList.contains('card')) c.dataset.idx = state.articles.findIndex(a=>a.pageid==c.dataset.pageid); });
}

/* ===================== TOAST ===================== */
function showToast(msg){
  const host = document.getElementById('toastHost');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  host.appendChild(t);
  setTimeout(()=>t.remove(), 2100);
}

/* ===================== MODES / CATEGORIES ===================== */
document.getElementById('modeTabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  [...document.querySelectorAll('#modeTabs button')].forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('categoryDrawer').classList.add('hidden');
  switchMode(btn.dataset.mode, null);
});

function renderChips(){
  chipRow.innerHTML = CATEGORIES.map(([label])=>`<button class="chip" data-label="${escapeHtml(label)}">${escapeHtml(label)}</button>`).join('');
}
chipRow.addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  [...chipRow.children].forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  const catObj = CATEGORY_BY_LABEL[chip.dataset.label];
  [...document.querySelectorAll('#modeTabs button')].forEach(b=>b.classList.remove('active'));
  if(!catObj.primary) switchMode('foryou', null);
  else switchMode('category', catObj);
});

document.getElementById('btnCategories').addEventListener('click', ()=>{
  document.getElementById('categoryDrawer').classList.toggle('hidden');
});

function switchMode(mode, category){
  state.mode = mode;
  state.category = category;
  categoryQueue = [];
  trendingQueue = null;
  feedEl.innerHTML = '';
  feedEl.scrollTop = 0;
  loadMore(3);
}

/* ===================== SEARCH ===================== */
const searchOverlay = document.getElementById('searchOverlay');
const searchInput = document.getElementById('searchInput');
const searchSuggestions = document.getElementById('searchSuggestions');
document.getElementById('btnSearch').addEventListener('click', ()=>{
  searchOverlay.classList.remove('hidden');
  setTimeout(()=>searchInput.focus(), 250);
});
document.getElementById('closeSearch').addEventListener('click', ()=> searchOverlay.classList.add('hidden'));

let searchDebounce;
searchInput.addEventListener('input', ()=>{
  clearTimeout(searchDebounce);
  const q = searchInput.value.trim();
  if(!q){ searchSuggestions.innerHTML=''; return; }
  searchDebounce = setTimeout(()=>runSuggest(q), 250);
});
async function runSuggest(q){
  try{
    const url = `${ACTION}?action=opensearch&search=${encodeURIComponent(q)}&limit=8&namespace=0&format=json&origin=*`;
    const r = await fetch(url);
    const [,titles,descs,urls] = await r.json();
    if(!titles.length){ searchSuggestions.innerHTML = `<li class="empty">No results for "${escapeHtml(q)}"</li>`; return; }
    searchSuggestions.innerHTML = titles.map((t,i)=>`<li data-title="${escapeHtml(t)}"><div class="s-title serif">${escapeHtml(t)}</div><div class="s-desc">${escapeHtml(descs[i]||'')}</div></li>`).join('');
  }catch(e){ searchSuggestions.innerHTML = `<li class="empty">Search unavailable — check connection.</li>`; }
}
searchSuggestions.addEventListener('click', async (e)=>{
  const li = e.target.closest('li[data-title]');
  if(!li) return;
  const q = li.dataset.title;
  searchOverlay.classList.add('hidden');
  [...document.querySelectorAll('#modeTabs button')].forEach(b=>b.classList.remove('active'));
  try{
    const url = `${ACTION}?action=query&list=search&srsearch=${encodeURIComponent(q)}&format=json&origin=*&srlimit=20`;
    const r = await fetch(url);
    const d = await r.json();
    searchQueue = (d.query && d.query.search || []).map(s=>s.title);
    if(!searchQueue.some(t=>t.toLowerCase()===q.toLowerCase())) searchQueue.unshift(q);
  }catch(err){ searchQueue = [q]; }
  switchMode('search', null);
});
searchInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && searchInput.value.trim()){
    const first = searchSuggestions.querySelector('li[data-title]');
    if(first) first.click();
  }
});

/* ===================== READER ===================== */
const readerOverlay = document.getElementById('readerOverlay');
const readerBody = document.getElementById('readerBody');
const readerProgressBar = document.getElementById('readerProgressBar');

async function openReader(article){
  readerOverlay.classList.remove('hidden');
  readerBody.style.fontSize = state.fontSize + 'px';
  readerBody.innerHTML = `<div class="reader-loading">Loading full article…</div>`;
  state.activeReaderPageid = article.pageid;
  try{
    const url = `${ACTION}?action=query&prop=extracts&explaintext=1&titles=${encodeURIComponent(article.title)}&format=json&origin=*`;
    const r = await fetch(url);
    const d = await r.json();
    const pages = d.query.pages;
    const page = pages[Object.keys(pages)[0]];
    const fullText = (page && page.extract) || article.extract;
    const paras = fullText.split(/\n+/).filter(p=>p.trim());
    let html = '';
    const readerImg = article.resolvedFull || article.originalimage || previewThumb(article);
    if(readerImg) html += `<img src="${readerImg}" alt="" loading="lazy">`;
    html += `<h1 class="serif">${escapeHtml(article.title)}</h1>`;
    if(article.description) html += `<p class="r-desc">${escapeHtml(article.description)}</p>`;
    paras.forEach(p=>{
      const words = p.trim().split(/\s+/).length;
      if(words <= 5 && !/[.!?]$/.test(p.trim())) html += `<div class="r-head">${escapeHtml(p.trim())}</div>`;
      else html += `<p>${escapeHtml(p.trim())}</p>`;
    });
    html += `<a class="r-ext" href="${article.url}" target="_blank" rel="noopener">View on Wikipedia ↗</a><a class="r-ext-alt" href="${britannicaUrl(article)}" target="_blank" rel="noopener">Search Britannica ↗</a>`;
    readerBody.innerHTML = html;
  }catch(e){
    readerBody.innerHTML = `<h1 class="serif">${escapeHtml(article.title)}</h1><p>${escapeHtml(article.extract)}</p><a class="r-ext" href="${article.url}" target="_blank" rel="noopener">View on Wikipedia ↗</a><a class="r-ext-alt" href="${britannicaUrl(article)}" target="_blank" rel="noopener">Search Britannica ↗</a>`;
  }
  readerBody.onscroll = ()=>{
    const max = readerBody.scrollHeight - readerBody.clientHeight;
    readerProgressBar.style.width = max>0 ? (readerBody.scrollTop/max*100)+'%' : '0%';
  };
}
document.getElementById('closeReader').addEventListener('click', ()=>{
  readerOverlay.classList.add('hidden');
  window.speechSynthesis && window.speechSynthesis.cancel();
});
document.getElementById('fontUp').addEventListener('click', ()=>{ state.fontSize = Math.min(24, state.fontSize+1); readerBody.style.fontSize = state.fontSize+'px'; });
document.getElementById('fontDown').addEventListener('click', ()=>{ state.fontSize = Math.max(13, state.fontSize-1); readerBody.style.fontSize = state.fontSize+'px'; });
document.getElementById('listenBtn').addEventListener('click', ()=>{
  const article = state.articles.find(a=>a.pageid===state.activeReaderPageid);
  if(article) toggleListen(article);
});

function toggleListen(article){
  if(!('speechSynthesis' in window)){ showToast('Voice not supported on this device'); return; }
  if(state.speaking){ window.speechSynthesis.cancel(); state.speaking = false; showToast('Stopped'); return; }
  const utter = new SpeechSynthesisUtterance(article.title + '. ' + article.extract);
  utter.rate = 1;
  utter.onend = ()=>{ state.speaking = false; };
  window.speechSynthesis.speak(utter);
  state.speaking = true;
  showToast('Reading aloud…');
}

/* ===================== PROFILE ===================== */
const profileOverlay = document.getElementById('profileOverlay');
document.getElementById('btnProfile').addEventListener('click', ()=>{ profileOverlay.classList.remove('hidden'); renderProfileStats(); renderList('saved'); });
document.getElementById('closeProfile').addEventListener('click', ()=> profileOverlay.classList.add('hidden'));

function updateStreakPill(){ document.getElementById('streakNum').textContent = state.stats.streak; }

const BADGES = [
  {key:'first', label:'First Steps', test:s=>s.stats.completed>=1},
  {key:'curious', label:'Curious Mind', test:s=>s.stats.completed>=10},
  {key:'bookworm', label:'Bookworm', test:s=>s.stats.completed>=25},
  {key:'scholar', label:'Scholar', test:s=>s.stats.completed>=50},
  {key:'streak3', label:'3-Day Streak', test:s=>s.stats.streak>=3},
  {key:'streak7', label:'Week Streak', test:s=>s.stats.streak>=7},
  {key:'collector', label:'Collector', test:s=>s.saved.length>=10},
  {key:'curator', label:'Curator', test:s=>s.favorites.length>=10},
];
function renderProfileStats(){
  document.getElementById('statXP').textContent = state.stats.xp;
  document.getElementById('statLevel').textContent = 1 + Math.floor(state.stats.xp/100);
  document.getElementById('statStreak').textContent = state.stats.streak;
  document.getElementById('statCompleted').textContent = state.stats.completed;
  document.getElementById('statSaved').textContent = state.saved.length;
  document.getElementById('badgeRow').innerHTML = BADGES.map(b=>{
    const earned = b.test(state);
    return `<span class="badge ${earned?'earned':''}">${earned?'✓ ':''}${b.label}</span>`;
  }).join('');
  const challenge = dailyChallenge();
  document.getElementById('challengeCard').innerHTML = `<div style="font-weight:600;margin-bottom:4px;">${challenge.title}</div><div style="font-size:12.5px;color:var(--text-mute);">${challenge.sub}</div>`;
  document.getElementById('challengeCard').onclick = ()=>{ profileOverlay.classList.add('hidden'); jumpRandom(currentVisibleIdx()); };
}
function currentVisibleIdx(){
  const cards = [...feedEl.querySelectorAll('.card')];
  for(const c of cards){ const r = c.getBoundingClientRect(); if(r.top >= -10 && r.top < window.innerHeight/2) return parseInt(c.dataset.idx,10); }
  return state.articles.length-1;
}
function dailyChallenge(){
  const idx = new Date().getDate() % CATEGORIES.length;
  const [label] = CATEGORIES[idx];
  return {title:`Explore ${label} today`, sub:'Tap to jump to a random article in this category'};
}

const listPanel = document.getElementById('listPanel');
document.querySelector('.tab-row').addEventListener('click', (e)=>{
  const btn = e.target.closest('button'); if(!btn) return;
  [...document.querySelectorAll('.tab-row button')].forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderList(btn.dataset.tab);
});
function renderList(tab){
  const data = tab==='saved' ? state.saved : tab==='favorites' ? state.favorites : state.history;
  if(!data.length){ listPanel.innerHTML = `<div class="empty-note">Nothing here yet — swipe around and ${tab==='history'?'articles will appear as you read':'tap the icons to add some'}.</div>`; return; }
  listPanel.innerHTML = data.map(a=>`<div class="list-row" data-pageid="${a.pageid}" data-title="${escapeHtml(a.title)}">
      <img src="${a.thumbnail||''}" onerror="this.style.display='none'">
      <div><div class="lt">${escapeHtml(a.title)}</div><div class="ld">${escapeHtml(a.description||'')}</div></div>
    </div>`).join('');
  [...listPanel.children].forEach(row=>{
    row.addEventListener('click', async ()=>{
      profileOverlay.classList.add('hidden');
      const full = await fetchSummaryByTitle(row.dataset.title, 'Wikipedia');
      if(full) openReader(full);
    });
  });
}

/* ===================== THEME ===================== */
const THEMES = ['dark','light','oled'];
document.getElementById('btnTheme').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const next = THEMES[(THEMES.indexOf(cur)+1)%THEMES.length];
  document.documentElement.setAttribute('data-theme', next);
  showToast(next[0].toUpperCase()+next.slice(1)+' mode');
});

/* ===================== KEYBOARD SHORTCUTS ===================== */
window.addEventListener('keydown', (e)=>{
  if(document.activeElement === searchInput) return;
  if(e.key==='ArrowDown'){ feedEl.scrollBy({top:window.innerHeight, behavior:'smooth'}); }
  if(e.key==='ArrowUp'){ feedEl.scrollBy({top:-window.innerHeight, behavior:'smooth'}); }
  if(e.key==='/'){ e.preventDefault(); document.getElementById('btnSearch').click(); }
  if(e.key==='r'){ jumpRandom(currentVisibleIdx()); }
  if(e.key==='Escape'){ [searchOverlay,readerOverlay,profileOverlay].forEach(o=>o.classList.add('hidden')); }
});

init();
})();
</script>
